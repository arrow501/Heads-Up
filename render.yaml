databases:
  - name: heads-up-db
    plan: free
    databaseName: heads_up
    user: heads_up_user

services:
  - type: web
    name: heads-up
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heads-up-db
          property: connectionString
      - key: NODE_ENV
        value: production
